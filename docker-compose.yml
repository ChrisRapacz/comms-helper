version: '3.8'

services:
  comms-helper:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # ANTHROPIC_API_KEY will be read from host environment variable
      # Pass it during deployment: ANTHROPIC_API_KEY=sk-ant-xxx docker-compose up -d
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped
    volumes:
      # Volume for persistent data (messages storage)
      - ./data:/app/data
