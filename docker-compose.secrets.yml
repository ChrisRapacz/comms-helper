# Docker Compose with Secrets (for production with Docker Swarm)
# Usage:
# 1. Create secret: echo "sk-ant-your-key" | docker secret create anthropic_api_key -
# 2. Deploy: docker stack deploy -c docker-compose.secrets.yml comms-helper

version: '3.8'

services:
  comms-helper:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Read API key from Docker secret
      - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
    secrets:
      - anthropic_api_key
    restart: unless-stopped
    volumes:
      - ./data:/app/data

secrets:
  anthropic_api_key:
    external: true
